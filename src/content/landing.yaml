about:
  title: Quienes Somos
  paragraphOne: >-
    Somos un equipo de asesores especializados en sistemas de salud, enfocados
    en entregar una asesoria gratuita, clara y personalizada, optimizando tu 7%
    de cotizacion obligatoria, mejorando tu cobertura y acceso a clinicas y
    centros medicos.
  paragraphTwo: >-
    Trabajamos con las principales Isapres del pais, lo que nos permite comparar
    objetivamente y recomendar los planes que mejor se adaptan a tu realidad y
    la de tu familia.
promoText: >-
  Tomar una buena decision en tu plan de salud puede ahorrarte miles de pesos al
  anio y darte tranquilidad en momentos importantes.
comparison:
  title: FONASA vs ISAPRE
  subtitle: Entiende las diferencias clave para elegir lo mejor para ti.
  fonasaTitle: FONASA
  fonasaSubtitle: Fondo Nacional de Salud
  isapreTitle: ISAPRE
  isapreSubtitle: Instituciones de Salud Previsional
  fonasaItems:
    - icon: payments
      text: >-
        Pagas solo el 7% de tu renta independiente de la cantidad de
        beneficiarios.
    - icon: schedule
      text: Atencion lenta y largas listas de espera.
    - icon: domain_disabled
      text: Cobertura minima en servicios privados.
    - icon: apartment
      text: Atencion en hospitales publicos.
    - icon: bed
      text: Condiciones hospitalarias de baja comodidad.
    - icon: list_alt
      text: No existen planes personalizados solo tramos A, B, C y D.
    - icon: info
      text: >-
        Ideal para personas de bajos recursos, con grupos familiares grandes y
        que prefieran la red publica de atencion.
  isapreItems:
    - icon: wallet
      text: El plan se paga por beneficiario, puede ser mayor que tu 7%.
    - icon: bolt
      text: Atencion rapida y excelente servicio.
    - icon: local_hospital
      text: Excelente cobertura en servicios privados de salud.
    - icon: hub
      text: Amplia red de prestadores privados.
    - icon: hotel
      text: Condiciones Hospitalarias de excelencia hotelera.
    - icon: person_add
      text: Planes personalizados para cada usuario segun sus necesidades.
    - icon: stars
      text: >-
        Ideal para personas con ingresos medio-alto, que deseen atencion rapida
        de calidad y en las mejores clinicas.
