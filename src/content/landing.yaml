faqTitle: Preguntas Frecuentes
faqs:
  - question: Como acceder al servicio?
    answer: >-
      Completa el formulario en linea, un asesor experto te contactara y
      recibiras ofertas personalizadas para comparar.
  - question: Debo cambiarme de Isapre si recibo asesoria?
    answer: >-
      No es obligatorio. Si tu plan actual es el mejor para tu situacion, te
      recomendaremos mantenerlo.
  - question: Que sucede si tengo enfermedades preexistentes?
    answer: >-
      Depende del diagnostico. Te asesoramos para declarar correctamente y
      evaluar alternativas viables.
