  badge: Nuestros Diferenciales
  title: Por que elegir nuestra asesoria?
  items:
    - icon: check_circle
      title: Asesoria personalizada y gratuita
      description: Adaptamos cada recomendacion a tu perfil especifico sin costo para ti.
