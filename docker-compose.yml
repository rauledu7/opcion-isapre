version: '3.8'
services:
  isapre-landing:
    build: .
    container_name: landing_app
    ports:
      - "80:3000"
    volumes:
      # PERSISTENCIA DE DATOS:
      # Vinculamos la carpeta de contenido (donde están los YAML)
      - ./src/content:/app/src/content
      # Vinculamos la carpeta de imágenes (donde el cliente sube logos)
      - ./public/images:/app/public/images
    restart: always
    environment:
      - NODE_ENV=production